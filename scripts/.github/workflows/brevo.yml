name: Actualizar datos de Brevo
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar estadisticas de Brevo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/brevo.mjs
      - name: Guardar cambios
        run: |
          git config user.name "actualizador-brevo"
          git config user.email "actions@github.com"
          git add brevo.json
          git diff --staged --quiet || git commit -m "Actualiza datos de Brevo"
          git push
